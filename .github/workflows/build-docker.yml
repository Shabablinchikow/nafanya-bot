name: Docker build and deploy

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

env:
  REGISTRY: rg.nl-ams.scw.cloud/shaba
  IMAGE_NAME: nafanya-bot
  SCW_CLUSTER_ID: 36de1392-6c3f-416a-a145-4d1c2b3695a0
  SCW_REGION: nl-ams

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add cert
        run: echo "${{ secrets.SSL_CERT }}" >> ssl-cert.crt

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:master
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure Scaleway CLI
        uses: scaleway/action-scw@v0
        with:
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          default-project-id: ${{ secrets.SCW_PROJECT_ID }}
          default-organization-id: ${{ secrets.SCW_ORG_ID }}
          save-config: true
          export-config: true

      - name: Save Scaleway kubeconfig
        run: scw k8s kubeconfig install ${{ env.SCW_CLUSTER_ID }} region=${{ env.SCW_REGION }} auth-method=copy-cli-token

      - name: Helm tool installer
        uses: Azure/setup-helm@v4

      - name: Run Helm upgrade
        # secrets go through env, not inline ${{ }}: the DB password has shell metacharacters
        env:
          AI_TOKEN: ${{ secrets.AI_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_USER: ${{ secrets.DB_USER }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_DIRECT_KEY: ${{ secrets.GEMINI_DIRECT_KEY }}
          DS_TOKEN: ${{ secrets.DS_TOKEN }}
        run: |
          helm upgrade --atomic --install nafanya-bot charts/app -f values.yaml \
            --set image.tag=${{ github.sha }} \
            --set-string secrets.ai_token="$AI_TOKEN" \
            --set-string secrets.bot_token="$BOT_TOKEN" \
            --set-string secrets.db_pass="$DB_PASS" \
            --set-string secrets.db_user="$DB_USER" \
            --set-string secrets.db_name=${{ vars.DB_NAME }} \
            --set-string secrets.db_host=${{ vars.DB_HOST }} \
            --set-string secrets.db_port=${{ vars.DB_PORT }} \
            --set-string secrets.db_sslmode=${{ vars.DB_SSLMODE }} \
            --set-string secrets.sentry_dsn="$SENTRY_DSN" \
            --set-string secrets.gemini_api_key="$GEMINI_API_KEY" \
            --set-string secrets.gemini_direct_key="$GEMINI_DIRECT_KEY" \
            --set-string secrets.ds_token="$DS_TOKEN"
